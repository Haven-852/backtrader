# 存储层：数据全部 bind-mount 到宿主机 E: 盘目录
# 即使 Docker Desktop / WSL vhdx 崩坏重建，业务数据仍保留在 ./data/docker/*
# 启动：docker compose -f docker-compose.storage.yml up -d

services:
  influxdb:
    image: influxdb:2.7
    container_name: backtrader-influxdb
    ports:
      - "8086:8086"
    volumes:
      - ./data/docker/influxdb:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=backtrader123
      - DOCKER_INFLUXDB_INIT_ORG=quant
      - DOCKER_INFLUXDB_INIT_BUCKET=market_data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=supersecretadmin token
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: backtrader-postgres
    ports:
      - "15432:5432"
    volumes:
      # 关键：挂到宿主机，不进 Docker 匿名/命名卷（vhdx 重建会丢）
      - ./data/docker/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=quant
      - POSTGRES_PASSWORD=backtrader123
      - POSTGRES_DB=backtrader
    command: postgres -c shared_preload_libraries=timescaledb
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: backtrader-redis
    ports:
      - "16379:6379"
    volumes:
      - ./data/docker/redis:/data
    command: redis-server --appendonly yes --dir /data
    restart: unless-stopped

  minio:
    # quay.io 常报 unauthorized；默认走 Docker Hub
    image: minio/minio:latest
    container_name: backtrader-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/docker/minio:/data
    environment:
      - MINIO_ROOT_USER=quant
      - MINIO_ROOT_PASSWORD=backtrader123
    command: server /data --console-address ":9001"
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: backtrader-clickhouse
    ports:
      - "18123:8123"
      - "19000:9000"
    volumes:
      - ./data/docker/clickhouse:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
